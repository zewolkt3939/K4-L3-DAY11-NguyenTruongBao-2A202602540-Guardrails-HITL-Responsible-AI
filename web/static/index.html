<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinBank AI Security Chatbot — Day 11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-container">
    <!-- Header with Agent Switcher -->
    <header>
      <div class="logo-group">
        <div class="logo-icon" id="headerLogoIcon">🛡️</div>
        <div class="logo-text">
          <h1>VinBank Security Chat</h1>
          <p id="headerSub">Chọn Agent bạn muốn tương tác</p>
        </div>
      </div>

      <!-- Segmented Agent Tabs -->
      <div class="agent-switcher" role="tablist">
        <button class="agent-tab active blue" id="tabBlue" onclick="switchAgent('blue')">
          <span>🛡️</span>
          <span>Blue Agent (Phòng Thủ)</span>
        </button>
        <button class="agent-tab red" id="tabRed" onclick="switchAgent('red')">
          <span>🔴</span>
          <span>Red Agent (Mềm)</span>
        </button>
        <button class="agent-tab red_advance" id="tabAdvance" onclick="switchAgent('red_advance')">
          <span>⚔️</span>
          <span>Red Advance (Cứng)</span>
        </button>
      </div>

      <button class="clear-btn" onclick="clearChat()" title="Xóa lịch sử trò chuyện">
        🗑️
      </button>
    </header>

    <!-- Persona & Mission Context Banner -->
    <div class="agent-banner banner-blue" id="agentBanner">
      <span id="bannerText">
        🛡️ <strong>Blue Agent (VinBank Assistant):</strong> Có bộ lọc Input & Output Guardrails bảo vệ. Không bao giờ để lộ mật khẩu, tự động che giấu PII và chặn injection.
      </span>
      <span style="font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.8;" id="bannerBadge">GUARDRAILS: ACTIVE</span>
    </div>

    <!-- Chat Messages Scroll Area -->
    <div class="chat-window" id="chatWindow">
      <!-- Messages dynamically populated by app.js -->
    </div>

    <!-- Quick Suggestion Chips (Dynamic by Agent) -->
    <div class="quick-chips" id="quickChips">
      <!-- Chips populated by app.js -->
    </div>

    <!-- Input Box -->
    <div class="input-container">
      <textarea id="chatInput" placeholder="Nhập câu hỏi hoặc câu prompt tấn công... (Nhấn Enter để gửi, Shift+Enter xuống dòng)" rows="1"></textarea>
      <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()" title="Gửi tin nhắn">
        ➤
      </button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
